services:
  falkordb:
    image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    ports:
      - '6379:6379'
      - '3001:3000'
    environment:
      FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 RESULTSET_SIZE 10000 TIMEOUT_DEFAULT 5000
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  falkordb-v4:
    profiles: [v4]
    image: falkordb/falkordb:v4.22.1@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - '6380:6379'
    environment:
      FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 RESULTSET_SIZE 10000 TIMEOUT_DEFAULT 5000

volumes:
  falkordb-data:
